[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

# Versions every crate that uses them must agree on. Sift and Glean share
# ratatui's types across the Surface boundary, so it is pinned here once.
[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
insta = "1.48.0"
ratatui = "0.30"
thiserror = "2"

# Shared profile tuning. Split debuginfo keeps incremental link times down,
# which matters most in the terminal frontend where the edit-run loop is tightest.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
must_use_candidate = "allow"
