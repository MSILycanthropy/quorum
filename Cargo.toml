[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
similar = "3"

# Shared profile tuning. Split debuginfo keeps incremental link times down,
# which matters most in the TUI crate where the edit-run loop is tightest.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
