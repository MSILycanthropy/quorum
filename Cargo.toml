[package]
name = "quorum"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A review surface for parallel coding agents."

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
gix = { version = "0.87.1", default-features = false, features = ["status", "merge", "parallel", "sha1", "revision", "blob-diff", "index"] }
ratatui = "0.30"
similar = { version = "3", features = ["unicode"] }
thiserror = "2"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# Shared profile tuning. Split debuginfo keeps incremental link times down,
# which matters most in the terminal frontend where the edit-run loop is tightest.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
insta = "1.48.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
must_use_candidate = "allow"
