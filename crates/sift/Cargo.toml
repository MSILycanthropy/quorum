[package]
name = "sift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A terminal diff viewer over git."

[dependencies]
clap.workspace = true
devicons = "0.6.13"
gix = { version = "0.87.1", default-features = false, features = ["status", "merge", "parallel", "sha1", "revision", "blob-diff", "index"] }
host = { path = "../host" }
hue = { path = "../hue" }
inkjet = { version = "0.11.1", default-features = false, features = [
    "theme",
    "language-bash",
    "language-c",
    "language-cpp",
    "language-css",
    "language-diff",
    "language-dockerfile",
    "language-eex",
    "language-elixir",
    "language-go",
    "language-hcl",
    "language-heex",
    "language-html",
    "language-ini",
    "language-java",
    "language-javascript",
    "language-json",
    "language-jsx",
    "language-lua",
    "language-make",
    "language-nix",
    "language-php",
    "language-proto",
    "language-python",
    "language-regex",
    "language-ruby",
    "language-rust",
    "language-scss",
    "language-sql",
    "language-toml",
    "language-tsx",
    "language-typescript",
    "language-yaml",
    "language-zig",
] }
ratatui.workspace = true
serde.workspace = true
similar = { version = "3", features = ["unicode"] }
thiserror.workspace = true
tree-sitter-embedded-template = "0.23"
config = { path = "../config" }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
